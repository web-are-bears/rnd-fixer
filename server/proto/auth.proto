syntax = "proto3";

package auth;

option go_package = "github.com/wbb/rnd-fixer/service/auth;auth";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
}
