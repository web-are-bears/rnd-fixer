syntax = "proto3";
package auth;

option go_package = "github.com/wbb/rnd-fixer/proto/gen/auth";

service AuthService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    string name     = 3;
    int32  role     = 4;
}

message RegisterResponse {
    string user_id = 1;
}