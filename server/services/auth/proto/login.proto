syntax = "proto3";
package com.github.wbb.auth;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service AuthService {
    rpc Register(RegisterRequest) returns (RegisterResponse) {
        option (google.api.http) = { post: "/v1/auth/register" body: "*" };
    }
    rpc Login(LoginRequest) returns (LoginResponse) {
        option (google.api.http) = { post: "/v1/auth/login" body: "*" };
    }

    rpc FetchUserByUsername(UsernameRequest) returns (UsernameResponse) {
        option (google.api.http) = { get: "/v1/auth/fetch/{username}" };
    }

    rpc FetchAllUsers(google.protobuf.Empty) returns (Users) {
        option (google.api.http) = { get: "/v1/auth/fetch" };
    }
}

message UsernameResponse {
    string username = 1;
    string role = 2;
}

message Users {
    repeated UsernameResponse users = 1;
}

message UsernameRequest {
    string username = 1;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    string name     = 3;
    string role     = 4;
}

message RegisterResponse {
    string user_id = 1;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
}